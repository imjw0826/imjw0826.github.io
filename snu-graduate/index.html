<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>임정원 이수 현황</title>
  <link rel="stylesheet" href="style.css?v=20261030b" />
</head>
<body class="graduate-page">
  <div class="project-topbar">
    <a class="project-topbar-link" href="../index.html">Garden home</a>
    <div class="project-topbar-links">
      <span class="project-topbar-current">SNU Graduate Tracker</span>
    </div>
  </div>

  <header class="site-header">
    <div class="header-top">
      <div class="header-title t-stagger">
        <span class="header-university t-stagger-line" id="header-university"></span>
        <h1 class="header-department t-stagger-line t-stagger-line--2" id="header-title"></h1>
        <span class="header-subtitle t-stagger-line t-stagger-line--3" id="header-subtitle"></span>
      </div>

      <section class="credit-summary" aria-label="credit summary">
        <div class="total-summary">
          <div class="summary-item">
            <span class="summary-label">이수학점</span>
            <strong class="summary-value t-digit-group" id="credit-count"></strong>
          </div>
          <div class="summary-divider"></div>
          <div class="summary-item">
            <span class="summary-label">채워야 할 학점</span>
            <strong class="summary-value t-digit-group" id="credit-required"></strong>
          </div>
        </div>
        <div class="credit-progress-bar" aria-label="total credit progress">
          <div class="credit-progress-fill" id="credit-progress" style="width: 0%"></div>
        </div>
        <div class="requirement-rings" id="requirement-rings"></div>
      </section>
    </div>
  </header>

  <nav class="filter-bar">
    <div class="filter-controls">
      <span class="filter-pill" aria-hidden="true"></span>
      <span class="filter-label">Filter</span>
      <span class="sync-status syncing" id="sync-status" role="status" aria-live="polite">
        <span class="sync-check" aria-hidden="true">✓</span>
        <span class="sync-text t-text-swap">Cloud sync</span>
      </span>
      <button class="filter-btn active" data-filter="all">전체</button>
      <button class="filter-btn" data-filter="교양">교양</button>
      <button class="filter-btn" data-filter="기계공학 전공">기계공학 전공</button>
      <button class="filter-btn" data-filter="경영학 전공">경영학 전공</button>
      <button class="filter-btn" data-filter="타 학과 전공">타 학과 전공</button>
    </div>

    <button class="trash-dropzone" id="trash-dropzone" type="button" aria-label="drag here to delete">
      <span class="trash-icon">🗑</span>
      <span class="trash-text">버리기</span>
    </button>
  </nav>

  <main class="curriculum-grid" id="curriculum-grid"></main>

  <div class="modal-backdrop hidden" id="course-modal-backdrop">
    <div class="course-modal t-modal" role="dialog" aria-modal="true" aria-labelledby="course-modal-title">
      <div class="modal-header">
        <h2 class="modal-title" id="course-modal-title">과목 추가</h2>
        <button class="modal-close" id="course-modal-close" type="button" aria-label="닫기">×</button>
      </div>

      <form class="course-form" id="course-form">
        <label class="form-field">
          <span>과목명</span>
          <input id="course-name" name="name" type="text" placeholder="예: 열역학" required />
        </label>

        <div class="form-grid">
          <label class="form-field">
            <span>학기</span>
            <select id="course-term" name="term" required>
              <option value="1-1">25년도 1학기</option>
              <option value="1-2">25년도 2학기</option>
              <option value="2-1">26년도 1학기</option>
              <option value="2-2">28년도 1학기</option>
              <option value="3-1">28년도 2학기</option>
              <option value="3-2">29년도 1학기</option>
              <option value="4-1">29년도 2학기</option>
              <option value="4-2">30년도 1학기</option>
              <option value="5-1">30년도 2학기</option>
              <option value="0-0">미정</option>
            </select>
          </label>

          <label class="form-field">
            <span>학점</span>
            <input id="course-credits" name="credits" type="number" min="1" max="6" step="1" value="3" required />
          </label>
        </div>

        <div class="form-field" id="course-categories-field">
          <div class="form-field-head">
            <span>분류 (중복 선택 가능)</span>
            <span class="form-error-msg" role="alert">분류를 하나 이상 선택해주세요.</span>
          </div>
          <div class="category-toggle-group" id="course-categories">
            <button type="button" class="category-toggle" data-category="교양">교양</button>
            <button type="button" class="category-toggle" data-category="기계공학 전공">기계공학 전공</button>
            <button type="button" class="category-toggle" data-category="경영학 전공">경영학 전공</button>
            <button type="button" class="category-toggle" data-category="타 학과 전공">타 학과 전공</button>
          </div>
        </div>

        <div class="modal-actions">
          <button class="danger-btn hidden" id="course-modal-delete" type="button">삭제</button>
          <button class="secondary-btn" id="course-modal-cancel" type="button">취소</button>
          <button class="primary-btn" id="course-modal-submit" type="submit">추가</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'snu-graduate-courses-v3';
    const trackerMeta = {
      university: 'Seoul National University',
      department: '서울대학교 공과대학 기계공학부',
      studentName: '임정원',
      studentId: '2025-19994',
      programSummary: '기계공학 주전공 · 경영학 복수전공',
      totalCreditsRequired: 130,
      requirements: {
        generalEducation: 49,
        mechanicalEngineering: 62,
        businessAdministration: 39
      }
    };
    const supportedCategories = ['교양', '기계공학 전공', '경영학 전공', '타 학과 전공'];
    const categoryPriority = ['기계공학 전공', '경영학 전공', '타 학과 전공', '교양'];
    const semesterPlan = [
      { year: 1, semester: 1, label: '25년도 1학기' },
      { year: 1, semester: 2, label: '25년도 2학기' },
      { year: 2, semester: 1, label: '26년도 1학기' },
      { year: 2, semester: 2, label: '28년도 1학기' },
      { year: 3, semester: 1, label: '28년도 2학기' },
      { year: 3, semester: 2, label: '29년도 1학기' },
      { year: 4, semester: 1, label: '29년도 2학기' },
      { year: 4, semester: 2, label: '30년도 1학기' },
      { year: 5, semester: 1, label: '30년도 2학기' },
      { year: 0, semester: 0, label: '미정' }
    ];
    const classByCategory = {
      '교양': 'ge',
      '기계공학 전공': 'mech',
      '경영학 전공': 'business',
      '타 학과 전공': 'cross'
    };
    const shortCategoryLabels = {
      '교양': '교양',
      '기계공학 전공': '기계',
      '경영학 전공': '경영',
      '타 학과 전공': '타'
    };

    const state = {
      meta: trackerMeta,
      courses: [],
      currentFilter: 'all',
      draggedCourseId: null,
      editingUid: null,
      suppressClick: false,
      remote: {
        enabled: false,
        ready: false,
        applyingRemote: false,
        docRef: null,
        setDoc: null,
        serverTimestamp: null,
        unsubscribe: null
      }
    };

    // Motion helpers (transitions.dev). Timings are read from the :root
    // tokens so JS timers stay in sync with the CSS.
    const rootStyle = getComputedStyle(document.documentElement);
    function cssMs(name, fallback) {
      const value = parseFloat(rootStyle.getPropertyValue(name));
      return Number.isFinite(value) ? value : fallback;
    }
    const MAX_STAGGERED_CARDS = 7;

    function setDigits(group, value) {
      const next = String(value);
      const prev = group.textContent.replace(/\s+/g, '');
      if (prev === next) return;

      let same = 0;
      while (same < prev.length && same < next.length && prev[same] === next[same]) same++;

      group.classList.remove('is-animating');
      group.replaceChildren();
      const chars = next.split('');
      chars.forEach((ch, i) => {
        const span = document.createElement('span');
        span.className = 't-digit';
        span.textContent = ch;
        if (i < same) span.dataset.same = '';
        if (i === chars.length - 2) span.dataset.stagger = '1';
        else if (i === chars.length - 1) span.dataset.stagger = '2';
        group.appendChild(span);
      });
      void group.offsetHeight;
      group.classList.add('is-animating');
    }

    // Text states swap, coalescing rapid updates (e.g. Syncing → Cloud saved)
    // so only the latest label is shown once the current swap finishes.
    function swapText(el, next) {
      el._target = next;
      if (el._swapping) return;
      if (el.textContent === next) return;

      el._swapping = true;
      const dur = cssMs('--text-swap-dur', 150);
      el.classList.add('is-exit');
      setTimeout(() => {
        el.textContent = el._target;
        el.classList.remove('is-exit');
        el.classList.add('is-enter-start');
        void el.offsetHeight;
        el.classList.remove('is-enter-start');
        setTimeout(() => {
          el._swapping = false;
          if (el._target !== el.textContent) swapText(el, el._target);
        }, dur);
      }, dur);
    }

    function createUid() {
      if (window.crypto && typeof window.crypto.randomUUID === 'function') {
        return window.crypto.randomUUID();
      }
      return `course-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function normalizeCourse(course) {
      const rawCategories = Array.isArray(course.categories)
        ? course.categories
        : (course.category ? [course.category] : []);
      const categories = categoryPriority.filter(category => rawCategories.includes(category));

      return {
        uid: course.uid || createUid(),
        name: String(course.name || '').trim(),
        year: Number(course.year),
        semester: Number(course.semester),
        credits: Number(course.credits),
        categories: categories.length > 0 ? categories : ['교양']
      };
    }

    function primaryCategory(course) {
      return categoryPriority.find(category => course.categories.includes(category)) || '교양';
    }

    function parseTermValue(value) {
      const [year, semester] = String(value).split('-').map(Number);
      return { year, semester };
    }

    function getTermValue(year, semester) {
      return `${year}-${semester}`;
    }

    function sumCredits(items) {
      return items.reduce((sum, item) => sum + item.credits, 0);
    }

    function creditsByCategory(courses, category) {
      return sumCredits(courses.filter(course => course.categories.includes(category)));
    }

    function compareCourses(a, b) {
      const priorityDifference =
        categoryPriority.indexOf(primaryCategory(a)) - categoryPriority.indexOf(primaryCategory(b));
      if (priorityDifference !== 0) return priorityDifference;
      return a.name.localeCompare(b.name, 'ko-KR', { sensitivity: 'base' });
    }

    function saveLocalCourses() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.courses));
    }

    function updateSyncStatus(text, mode = 'local') {
      const status = document.getElementById('sync-status');
      const textNode = status.querySelector('.sync-text');
      if (textNode) {
        swapText(textNode, text);
      } else {
        status.textContent = text;
      }
      status.className = `sync-status ${mode}`;
    }

    async function persistCourses() {
      saveLocalCourses();

      if (!state.remote.enabled || !state.remote.ready || state.remote.applyingRemote) {
        updateSyncStatus('Local saved', 'local');
        return;
      }

      updateSyncStatus('Syncing...', 'syncing');

      try {
        await state.remote.setDoc(state.remote.docRef, {
          courses: state.courses,
          updatedAt: state.remote.serverTimestamp()
        }, { merge: true });
        updateSyncStatus('Cloud saved', 'online');
      } catch (error) {
        console.warn('Firestore save failed. Local copy was kept.', error);
        updateSyncStatus('Cloud offline · local saved', 'local');
      }
    }

    function saveCourses() {
      void persistCourses();
    }

    function loadStoredCourses() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;

      try {
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed)) return null;
        return parsed.map(normalizeCourse);
      } catch {
        return null;
      }
    }

    async function renderSyncedCourses(courses) {
      state.remote.applyingRemote = true;
      state.courses = courses.map(normalizeCourse);
      saveLocalCourses();
      renderAll();
      setFilter(state.currentFilter);
      state.remote.applyingRemote = false;
    }

    async function seedRemoteCourses(seedCourses) {
      if (state.remote.seeding) return;
      state.remote.seeding = true;
      state.courses = seedCourses.map(normalizeCourse);
      await persistCourses();
      renderAll();
      setFilter(state.currentFilter);
      state.remote.seeding = false;
    }

    async function initFirebaseSync(seedCourses) {
      try {
        const configModule = await import('./firebase-config.js');
        const firebaseSettings = configModule.firebaseSettings || {};
        const firebaseConfig = configModule.firebaseConfig || {};
        const isConfigured = Boolean(firebaseSettings.enabled && firebaseConfig.apiKey && !String(firebaseConfig.apiKey).includes('YOUR_'));

        if (!isConfigured) {
          updateSyncStatus('Local mode', 'local');
          return false;
        }

        const [{ initializeApp }, firestore] = await Promise.all([
          import('https://www.gstatic.com/firebasejs/11.9.0/firebase-app.js'),
          import('https://www.gstatic.com/firebasejs/11.9.0/firebase-firestore.js')
        ]);

        const app = initializeApp(firebaseConfig);
        const db = firestore.getFirestore(app);
        const collectionPath = firebaseSettings.collectionPath || 'snuGraduateTrackers';
        const documentId = firebaseSettings.documentId || 'default';

        state.remote.enabled = true;
        state.remote.ready = true;
        state.remote.docRef = firestore.doc(db, collectionPath, documentId);
        state.remote.setDoc = firestore.setDoc;
        state.remote.serverTimestamp = firestore.serverTimestamp;

        updateSyncStatus('Connecting...', 'syncing');

        state.remote.unsubscribe = firestore.onSnapshot(state.remote.docRef, snapshot => {
          const data = snapshot.data();

          if (!snapshot.exists() || !Array.isArray(data.courses)) {
            void seedRemoteCourses(seedCourses);
            return;
          }

          void renderSyncedCourses(data.courses);
          updateSyncStatus('Cloud synced', 'online');
        }, error => {
          console.warn('Firestore listener failed. Local copy remains available.', error);
          updateSyncStatus('Cloud offline · local saved', 'local');
          state.courses = seedCourses.map(normalizeCourse);
          renderAll();
          setFilter(state.currentFilter);
        });
        return true;
      } catch (error) {
        console.warn('Firebase sync is not configured or could not start.', error);
        updateSyncStatus('Local mode', 'local');
        return false;
      }
    }

    // Tabs sliding: the pill follows the active filter button. Tracks the
    // vertical offset too because the filter row can wrap.
    function moveFilterPill(animate) {
      const controls = document.querySelector('.filter-controls');
      const pill = controls.querySelector('.filter-pill');
      const active = controls.querySelector('.filter-btn.active');
      if (!pill || !active) return;

      const place = () => {
        const box = controls.getBoundingClientRect();
        const rect = active.getBoundingClientRect();
        pill.style.transform = `translate(${rect.left - box.left}px, ${rect.top - box.top}px)`;
        pill.style.width = `${rect.width}px`;
        pill.style.height = `${rect.height}px`;
      };

      if (animate && controls.classList.contains('has-pill')) {
        place();
        return;
      }

      const prev = pill.style.transition;
      pill.style.transition = 'none';
      place();
      void pill.offsetWidth;
      pill.style.transition = prev;
      controls.classList.add('has-pill');
    }

    function setFilter(filter) {
      const changed = filter !== state.currentFilter;
      state.currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(button => {
        button.classList.toggle('active', button.dataset.filter === filter);
      });
      moveFilterPill(true);
      // Reveal the cards on the first render and when the filter changes,
      // but not on every sync re-render.
      const animate = changed || !state.hasRevealed;
      buildGrid(animate);
      if (animate) state.hasRevealed = true;
    }

    function buildCard(course) {
      const cls = classByCategory[primaryCategory(course)] || 'ge';
      const card = document.createElement('article');
      card.className = `course-card ${cls}`;
      card.dataset.uid = course.uid;
      card.draggable = true;

      const tags = course.categories
        .map(category => `<span class="card-type-tag" title="${category}">${shortCategoryLabels[category] || category}</span>`)
        .join('');

      card.innerHTML = `
        <div class="card-header">
          <span class="card-tags">${tags}</span>
          <span class="card-credits">${course.credits}학점</span>
        </div>
        <div class="card-name">${course.name}</div>
      `;

      card.addEventListener('click', () => {
        if (state.suppressClick) return;
        openCourseModal({ course });
      });

      card.addEventListener('dragstart', event => {
        state.draggedCourseId = course.uid;
        state.suppressClick = true;
        card.classList.add('dragging');
        document.body.classList.add('dragging-course');
        event.dataTransfer.effectAllowed = 'move';
        event.dataTransfer.setData('text/plain', course.uid);
      });

      card.addEventListener('dragend', () => {
        clearDragState();
        setTimeout(() => {
          state.suppressClick = false;
        }, 0);
      });

      return card;
    }

    function buildAddCard(year, semester) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'add-course-card';
      button.innerHTML = `
        <span class="add-course-plus">+</span>
        <span class="add-course-text">과목 추가</span>
      `;

      button.addEventListener('click', () => {
        openCourseModal({ year, semester });
      });

      return button;
    }

    function handleSemesterDrop(year, semester) {
      if (!state.draggedCourseId) return;

      const course = state.courses.find(item => item.uid === state.draggedCourseId);
      if (!course) return;

      course.year = year;
      course.semester = semester;
      saveCourses();
      renderAll();
    }

    function markEntering(element, index) {
      element.classList.add('is-entering');
      element.style.setProperty('--i', Math.min(index, MAX_STAGGERED_CARDS));
      element.addEventListener('animationend', () => {
        element.classList.remove('is-entering');
        element.style.removeProperty('--i');
      }, { once: true });
    }

    function buildGrid(animate = false) {
      const grid = document.getElementById('curriculum-grid');
      grid.innerHTML = '';

      semesterPlan.forEach(({ year, semester, label: termLabel }) => {
          const section = document.createElement('section');
          section.className = 'semester-column';

          const label = document.createElement('div');
          label.className = 'semester-column-label';
          label.textContent = termLabel;
          section.appendChild(label);

          const list = document.createElement('div');
          list.className = 'semester-courses';

          const semesterCourses = state.courses
            .filter(course => course.year === year && course.semester === semester)
            .sort(compareCourses);
          const visibleCourses = semesterCourses
            .filter(course => state.currentFilter === 'all' || course.categories.includes(state.currentFilter))
            .sort(compareCourses);

          visibleCourses.forEach((course, index) => {
            const card = buildCard(course);
            if (animate) markEntering(card, index);
            list.appendChild(card);
          });

          if (visibleCourses.length === 0) {
            const empty = document.createElement('div');
            empty.className = 'semester-empty';
            empty.textContent = semesterCourses.length === 0 ? '—' : '해당 분류 과목 없음';
            list.appendChild(empty);
          }

          const addCard = buildAddCard(year, semester);
          if (animate) markEntering(addCard, visibleCourses.length);
          list.appendChild(addCard);

          section.addEventListener('dragover', event => {
            event.preventDefault();
            if (!state.draggedCourseId) return;
            section.classList.add('drop-target');
          });

          section.addEventListener('dragleave', event => {
            if (!section.contains(event.relatedTarget)) {
              section.classList.remove('drop-target');
            }
          });

          section.addEventListener('drop', event => {
            event.preventDefault();
            section.classList.remove('drop-target');
            handleSemesterDrop(year, semester);
          });

          section.appendChild(list);
          grid.appendChild(section);
      });
    }

    function buildRequirementCard(config) {
      const card = document.createElement('section');
      card.className = 'ring-card';
      card.dataset.ring = config.ringClass;

      card.innerHTML = `
        <div class="progress-ring ${config.ringClass}" style="--pct:0%">
          <div class="progress-ring-inner">
            <strong class="t-digit-group"></strong>
            <span>/ ${config.required}</span>
          </div>
        </div>
        <div class="ring-label">${config.label}</div>
      `;

      return card;
    }

    // Rings are kept in the DOM and updated in place so the fill and the
    // count can animate from their previous values.
    function updateRequirementCard(card, config) {
      const percent = config.required > 0 ? Math.min((config.current / config.required) * 100, 100) : 0;
      const ring = card.querySelector('.progress-ring');
      void ring.offsetWidth; // commit the previous fill (0% for a new ring) so it tweens
      ring.style.setProperty('--pct', `${percent.toFixed(2)}%`);
      setDigits(card.querySelector('.progress-ring-inner strong'), config.current);
    }

    function updateHeader() {
      document.title = `${state.meta.studentName} 이수 현황`;
      document.getElementById('header-university').textContent = state.meta.university;
      document.getElementById('header-title').textContent = `${state.meta.studentName} (${state.meta.studentId})`;
      document.getElementById('header-subtitle').textContent = `${state.meta.department} · ${state.meta.programSummary}`;

      const headerTitle = document.querySelector('.header-title');
      if (!headerTitle.classList.contains('is-shown')) {
        void headerTitle.offsetHeight;
        headerTitle.classList.add('is-shown');
      }
    }

    function updateSummary() {
      const rings = document.getElementById('requirement-rings');
      const total = sumCredits(state.courses);
      const totalPercent = state.meta.totalCreditsRequired > 0
        ? Math.min((total / state.meta.totalCreditsRequired) * 100, 100)
        : 0;

      setDigits(document.getElementById('credit-count'), total);
      setDigits(document.getElementById('credit-required'), state.meta.totalCreditsRequired);
      document.getElementById('credit-progress').style.width = `${totalPercent}%`;

      [
        {
          label: '교양',
          current: creditsByCategory(state.courses, '교양'),
          required: state.meta.requirements.generalEducation,
          ringClass: 'ge'
        },
        {
          label: '기계공학 전공',
          current: creditsByCategory(state.courses, '기계공학 전공'),
          required: state.meta.requirements.mechanicalEngineering,
          ringClass: 'mech'
        },
        {
          label: '경영학 전공',
          current: creditsByCategory(state.courses, '경영학 전공'),
          required: state.meta.requirements.businessAdministration,
          ringClass: 'business'
        }
      ].forEach(config => {
        let card = rings.querySelector(`[data-ring="${config.ringClass}"]`);
        if (!card) {
          card = buildRequirementCard(config);
          rings.appendChild(card);
        }
        updateRequirementCard(card, config);
      });
    }

    function renderAll() {
      updateHeader();
      updateSummary();
      buildGrid();
      clearDragState();
    }

    function setModalCategories(categories) {
      document.querySelectorAll('#course-categories .category-toggle').forEach(button => {
        button.classList.toggle('selected', categories.includes(button.dataset.category));
      });
    }

    function getModalCategories() {
      return [...document.querySelectorAll('#course-categories .category-toggle.selected')]
        .map(button => button.dataset.category);
    }

    function openCourseModal(options) {
      const course = options.course || null;
      state.editingUid = course ? course.uid : null;

      document.getElementById('course-modal-title').textContent = course ? '과목 수정' : '과목 추가';
      document.getElementById('course-modal-submit').textContent = course ? '저장' : '추가';
      document.getElementById('course-modal-delete').classList.toggle('hidden', !course);
      document.getElementById('course-name').value = course ? course.name : '';
      document.getElementById('course-term').value = course
        ? getTermValue(course.year, course.semester)
        : getTermValue(options.year, options.semester);
      document.getElementById('course-credits').value = course ? String(course.credits) : '3';
      setModalCategories(course ? course.categories : ['교양']);

      clearCategoryError();

      const backdrop = document.getElementById('course-modal-backdrop');
      const modal = backdrop.querySelector('.t-modal');
      clearTimeout(state.modalCloseTimer);
      backdrop.classList.remove('hidden', 'is-closing');
      modal.classList.remove('is-closing');
      void modal.offsetWidth; // start from the pre-open scale
      backdrop.classList.add('is-open');
      modal.classList.add('is-open');
      requestAnimationFrame(() => {
        document.getElementById('course-name').focus();
      });
    }

    function closeCourseModal() {
      const backdrop = document.getElementById('course-modal-backdrop');
      if (backdrop.classList.contains('hidden') || backdrop.classList.contains('is-closing')) return;

      const modal = backdrop.querySelector('.t-modal');
      state.editingUid = null;
      backdrop.classList.remove('is-open');
      modal.classList.remove('is-open');
      backdrop.classList.add('is-closing');
      modal.classList.add('is-closing');

      clearTimeout(state.modalCloseTimer);
      state.modalCloseTimer = setTimeout(() => {
        backdrop.classList.add('hidden');
        backdrop.classList.remove('is-closing');
        modal.classList.remove('is-closing');
        document.getElementById('course-form').reset();
        clearCategoryError();
      }, cssMs('--modal-close-dur', 150));
    }

    function clearCategoryError() {
      const field = document.getElementById('course-categories-field');
      clearTimeout(field._revertTimer);
      field._revertTimer = null;
      field.classList.remove('is-error');
    }

    // Error state shake on the category group instead of a blocking alert.
    function showCategoryError() {
      const field = document.getElementById('course-categories-field');
      const group = document.getElementById('course-categories');
      field.classList.add('is-error');

      group.classList.remove('is-shaking');
      void group.offsetWidth;
      group.classList.add('is-shaking');

      const shakeMs = cssMs('--shake-dur-a', 80) * 2 + cssMs('--shake-dur-b', 60) * 2;
      setTimeout(() => group.classList.remove('is-shaking'), shakeMs + 20);

      clearTimeout(field._revertTimer);
      field._revertTimer = setTimeout(() => {
        field._revertTimer = null;
        field.classList.remove('is-error');
      }, shakeMs + cssMs('--revert-hold', 3000));
    }

    function clearDragState() {
      state.draggedCourseId = null;
      document.body.classList.remove('dragging-course');
      document.querySelectorAll('.course-card.dragging').forEach(card => {
        card.classList.remove('dragging');
      });
      document.querySelectorAll('.semester-column.drop-target').forEach(column => {
        column.classList.remove('drop-target');
      });
      document.getElementById('trash-dropzone').classList.remove('drag-near', 'drag-over');
    }

    function removeDraggedCourse() {
      if (!state.draggedCourseId) return;
      state.courses = state.courses.filter(course => course.uid !== state.draggedCourseId);
      saveCourses();
      renderAll();
    }

    document.querySelector('.filter-controls').addEventListener('click', event => {
      const button = event.target.closest('.filter-btn');
      if (!button) return;
      setFilter(button.dataset.filter);
    });

    document.getElementById('course-categories').addEventListener('click', event => {
      const button = event.target.closest('.category-toggle');
      if (!button) return;
      button.classList.toggle('selected');
      if (button.classList.contains('selected')) clearCategoryError();
    });

    document.getElementById('course-form').addEventListener('submit', event => {
      event.preventDefault();

      const categories = getModalCategories();
      if (categories.length === 0) {
        showCategoryError();
        return;
      }

      const term = parseTermValue(document.getElementById('course-term').value);
      const payload = {
        name: document.getElementById('course-name').value,
        year: term.year,
        semester: term.semester,
        credits: document.getElementById('course-credits').value,
        categories
      };

      let course;
      if (state.editingUid) {
        const index = state.courses.findIndex(item => item.uid === state.editingUid);
        if (index === -1) return;
        course = normalizeCourse({ ...payload, uid: state.editingUid });
        state.courses[index] = course;
      } else {
        course = normalizeCourse(payload);
        state.courses.push(course);
      }

      saveCourses();

      if (state.currentFilter !== 'all' && !course.categories.includes(state.currentFilter)) {
        state.currentFilter = 'all';
      }

      closeCourseModal();
      renderAll();
      setFilter(state.currentFilter);
    });

    document.getElementById('course-modal-delete').addEventListener('click', () => {
      if (!state.editingUid) return;
      state.courses = state.courses.filter(course => course.uid !== state.editingUid);
      saveCourses();
      closeCourseModal();
      renderAll();
    });

    document.getElementById('course-modal-close').addEventListener('click', closeCourseModal);
    document.getElementById('course-modal-cancel').addEventListener('click', closeCourseModal);
    document.getElementById('course-modal-backdrop').addEventListener('click', event => {
      if (event.target.id === 'course-modal-backdrop') closeCourseModal();
    });

    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') {
        closeCourseModal();
      }
    });

    const trashDropzone = document.getElementById('trash-dropzone');

    trashDropzone.addEventListener('dragover', event => {
      event.preventDefault();
      if (!state.draggedCourseId) return;
      trashDropzone.classList.add('drag-over');
    });

    trashDropzone.addEventListener('dragleave', event => {
      if (!trashDropzone.contains(event.relatedTarget)) {
        trashDropzone.classList.remove('drag-over');
      }
    });

    trashDropzone.addEventListener('drop', event => {
      event.preventDefault();
      removeDraggedCourse();
    });

    document.addEventListener('dragover', event => {
      if (!state.draggedCourseId) return;

      const rect = trashDropzone.getBoundingClientRect();
      const padding = 56;
      const isNear =
        event.clientX >= rect.left - padding &&
        event.clientX <= rect.right + padding &&
        event.clientY >= rect.top - padding &&
        event.clientY <= rect.bottom + padding;

      trashDropzone.classList.toggle('drag-near', isNear);
    });

    // Snap the filter pill (no tween) on first paint, resize and font load.
    requestAnimationFrame(() => moveFilterPill(false));
    window.addEventListener('resize', () => moveFilterPill(false));
    // The sync label sits before the buttons, so its width changes move them.
    if ('ResizeObserver' in window) {
      new ResizeObserver(() => moveFilterPill(false)).observe(document.getElementById('sync-status'));
    }
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(() => moveFilterPill(false));
    }

    async function bootTracker() {
      const seedCourses = loadStoredCourses() || [];
      const willUseCloud = await initFirebaseSync(seedCourses);

      if (!willUseCloud) {
        state.courses = seedCourses;
        renderAll();
        setFilter('all');
      }
    }

    void bootTracker();
  </script>
</body>
</html>
