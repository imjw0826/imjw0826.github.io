    <script>
      (async function () {
        const list = document.getElementById('blog-list');
        try {
          const res = await fetch('posts/index.json', { cache: 'no-store' });
          const posts = await res.json();
          posts.sort((a, b) => (a.date < b.date ? 1 : -1));

          list.innerHTML = '';
          if (!posts.length) {
            list.innerHTML = '<p class="empty-note">No posts yet — check back soon.</p>';
            return;
          }
          for (const p of posts) {
            const a = document.createElement('a');
            a.className = 'post-item';
            a.href = 'post.html?slug=' + encodeURIComponent(p.slug);
            const tags = (p.tags || []).join(' · ');
            a.innerHTML =
              '<div class="meta"><span>' + p.date + '</span>' + (tags ? '<span>' + tags + '</span>' : '') + '</div>' +
              '<h3>' + p.title + '</h3>' +
              '<p class="excerpt">' + (p.excerpt || '') + '</p>';
            list.appendChild(a);
          }
        } catch (e) {
          list.innerHTML =
            '<p class="empty-note">Could not load posts. (Running from file://? Serve with a local web server to load posts/index.json.)</p>';
        }
      })();
    </script>
