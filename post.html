    <script>
      const escapeHtml = (value) =>
        String(value).replace(/[&<>"']/g, (char) => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        })[char]);

      const resolvePost = async () => {
        const params = new URLSearchParams(window.location.search);
        const slug = params.get('slug') || 'markdown-test';
        let meta = {
          slug,
          title: slug.replace(/-/g, ' '),
          date: '',
          tags: []
        };

        const indexRes = await fetch('posts/index.json', { cache: 'no-store' });
        if (indexRes.ok) {
          const posts = await indexRes.json();
          meta = posts.find((post) => post.slug === slug) || posts[0] || meta;
        }

        const mdRes = await fetch(`posts/${meta.slug}.md`, { cache: 'no-store' });
        if (!mdRes.ok) {
          throw new Error(`Could not fetch posts/${meta.slug}.md`);
        }
        const markdown = await mdRes.text();

        document.title = `${meta.title} — Jungwon Im`;
        document.getElementById('post-title').textContent = meta.title;
        document.getElementById('post-meta').innerHTML =
          `<span>${escapeHtml(meta.date)}</span><span>${escapeHtml((meta.tags || []).join(' · '))}</span>`;

        if (window.marked) {
          marked.setOptions({
            gfm: true,
            breaks: false
          });
          document.getElementById('post-content').innerHTML = marked.parse(markdown);
        } else {
          document.getElementById('post-content').innerHTML =
            `<pre><code>${escapeHtml(markdown)}</code></pre>`;
        }

        if (window.hljs) {
          document.querySelectorAll('#post-content pre code').forEach((block) => {
            hljs.highlightElement(block);
          });
        }

        if (window.MathJax && MathJax.typesetPromise) {
          await MathJax.typesetPromise([document.getElementById('post-content')]);
        }
      };

      resolvePost().catch((error) => {
        document.getElementById('post-title').textContent = 'Could not load post.';
        document.getElementById('post-content').innerHTML =
          `<p>Post loading failed: ${escapeHtml(error.message)}</p>`;
      });
    </script>
